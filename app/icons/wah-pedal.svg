<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The app icon at 48 px and up: a wah pedal from the side, the treadle
       rocked toe-up over its housing, the rack gear showing in the gap under
       the toe, on the app's accent orange. app/icons/wah-pedal-small.svg is the
       same pedal simplified for 16 and 32 px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe4d"/>
      <stop offset="1" stop-color="#ee8408"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#434953"/>
      <stop offset="1" stop-color="#1a1d22"/>
    </linearGradient>
    <linearGradient id="treadle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d646e"/>
      <stop offset="1" stop-color="#2b2f35"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9bdc4"/>
      <stop offset="1" stop-color="#5f646c"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#tile)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#gloss)"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>

  <g transform="translate(-4,-34)">
    <!-- floor shadow -->
    <ellipse cx="258" cy="394" rx="184" ry="24" fill="#7a3a00" fill-opacity="0.22"/>
    <ellipse cx="258" cy="392" rx="156" ry="15" fill="#7a3a00" fill-opacity="0.30"/>

    <!-- feet -->
    <rect x="118" y="372" width="52" height="18" rx="6" fill="#131518"/>
    <rect x="344" y="372" width="52" height="18" rx="6" fill="#131518"/>

    <!-- the rack gear, behind the housing -->
    <g fill="#fff3dc">
      <circle cx="350" cy="306" r="30"/>
      <rect x="343" y="263" width="14" height="18" rx="3"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(36 350 306)"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(72 350 306)"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(108 350 306)"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(144 350 306)"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(180 350 306)"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(216 350 306)"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(252 350 306)"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(288 350 306)"/>
      <rect x="343" y="263" width="14" height="18" rx="3" transform="rotate(324 350 306)"/>
    </g>
    <circle cx="350" cy="306" r="11" fill="#2a2e34"/>

    <!-- housing: a deep wedge with a sloped toe end -->
    <path d="M118 300 H390 Q406 300 410 314 L424 362 Q428 378 410 378 H104 Q86 378 88 362 L96 314 Q100 300 118 300 Z"
          fill="url(#body)"/>
    <rect x="110" y="300" width="286" height="4" rx="2" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="150" cy="322" r="12" fill="url(#bolt)"/>
    <circle cx="150" cy="322" r="4.5" fill="#24272c"/>
    <circle cx="384" cy="344" r="6" fill="#5b616b"/>

    <!-- treadle, rocked toe-up, heel resting on the housing -->
    <g transform="rotate(-11 150 292)">
      <rect x="108" y="254" width="326" height="40" rx="16" fill="url(#treadle)"/>
      <rect x="114" y="257" width="314" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="138" y="238" width="290" height="22" rx="8" fill="#0f1013"/>
      <g fill="#2c2f35">
        <rect x="152" y="243" width="8" height="12" rx="2"/>
        <rect x="175" y="243" width="8" height="12" rx="2"/>
        <rect x="198" y="243" width="8" height="12" rx="2"/>
        <rect x="221" y="243" width="8" height="12" rx="2"/>
        <rect x="244" y="243" width="8" height="12" rx="2"/>
        <rect x="267" y="243" width="8" height="12" rx="2"/>
        <rect x="290" y="243" width="8" height="12" rx="2"/>
        <rect x="313" y="243" width="8" height="12" rx="2"/>
        <rect x="336" y="243" width="8" height="12" rx="2"/>
        <rect x="359" y="243" width="8" height="12" rx="2"/>
        <rect x="382" y="243" width="8" height="12" rx="2"/>
        <rect x="405" y="243" width="8" height="12" rx="2"/>
      </g>
    </g>
  </g>
</svg>
